spring.application.name=backend
server.port=8081

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.datasource.hikari.maximum-pool-size=3

lms.client.stripe.enabled=${LMS_CLIENT_STRIPE_ENABLED:false}

lms.shared.session-idle-timeout-minutes=${LMS_SESSION_IDLE_TIMEOUT_MINUTES:15}
lms.shared.bootstrap-admin-username=${LMS_BOOTSTRAP_ADMIN_USERNAME:}
lms.shared.bootstrap-admin-temporary-password=${LMS_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD:}

server.servlet.session.timeout=${lms.shared.session-idle-timeout-minutes}m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Packaged static files can have the same timestamp across releases.
spring.web.resources.cache.use-last-modified=false
spring.web.resources.cache.cachecontrol.no-store=true
