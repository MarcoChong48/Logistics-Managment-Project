# Apply the reviewed migrations before running this profile.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties[currentSchema]=lms_delivery_runtime
spring.datasource.hikari.data-source-properties[stringtype]=unspecified
spring.datasource.hikari.data-source-properties[sslmode]=${SUPABASE_DB_SSL_MODE:verify-full}
spring.datasource.hikari.maximum-pool-size=4
spring.sql.init.mode=never
app.demo-enabled=false
app.maintenance-enabled=false
