spring.application.name=lms-delivery
spring.profiles.default=demo
app.demo-enabled=false
app.data-dir=${LMS_DATA_DIR:./data}
spring.datasource.url=jdbc:h2:file:${app.data-dir}/database;DB_CLOSE_ON_EXIT=FALSE;DEFAULT_LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=${LMS_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.sql.init.mode=always
spring.h2.console.enabled=false
server.address=${LMS_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.photo-limit-bytes=5242880
app.stale-claim-minutes=30
app.review-failure-count=2
app.reminder-days=3
app.final-review-days=7
app.maintenance-delay-ms=3600000
