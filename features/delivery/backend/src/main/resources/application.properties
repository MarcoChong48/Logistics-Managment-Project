spring.application.name=lms-delivery
spring.profiles.default=supabase
app.demo-enabled=false
app.data-dir=${LMS_DATA_DIR:./data}
server.address=${LMS_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
app.photo-limit-bytes=5242880
app.stale-claim-minutes=30
app.review-failure-count=2
app.reminder-days=3
app.final-review-days=7
app.maintenance-delay-ms=3600000
