# Local development ONLY. No Supabase credentials; do not deploy publicly.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_local_dev_only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Used ONLY during first initialization of an empty database volume.
      - ./database/01_create_tables.sql:/docker-entrypoint-initdb.d/01_create_tables.sql:ro
      - ./database/03_admin_changes.sql:/docker-entrypoint-initdb.d/03_admin_changes.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8081:8081"
    environment: &admin_backend_environment
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lms
      SPRING_DATASOURCE_USERNAME: lms
      SPRING_DATASOURCE_PASSWORD: lms_local_dev_only
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_PROFILES_ACTIVE: admintest
      LMS_SESSION_IDLE_TIMEOUT_MINUTES: 15
      LMS_BOOTSTRAP_ADMIN_USERNAME: "${LMS_BOOTSTRAP_ADMIN_USERNAME:-admin_local}"
      LMS_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD: "${LMS_BOOTSTRAP_ADMIN_TEMPORARY_PASSWORD:?Set a local bootstrap password in .env}"
      LMS_BOOTSTRAP_ADMIN_RESET_ON_START: "${LMS_BOOTSTRAP_ADMIN_RESET_ON_START:-false}"
    depends_on:
      db:
        condition: service_healthy

  # TEMPORARY TEST CODE - remove before integration (Stage 4 flow checks).
  flow-check:
    profiles: [check]
    build:
      context: ./backend
      target: flow-check
    environment:
      <<: *admin_backend_environment
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lms_flow_check
      SPRING_PROFILES_ACTIVE: ""
      LMS_BOOTSTRAP_ADMIN_RESET_ON_START: "false"
    volumes:
      - ./database:/flow-schema:ro
      - ./README.md:/flow-docs/README.md:ro
      - ./TEAM_GUIDE.md:/flow-docs/TEAM_GUIDE.md:ro
      - ./docs/DESIGN_NOTES_GENERAL.md:/flow-docs/DESIGN_NOTES_GENERAL.md:ro
      # TEMPORARY TEST CODE - remove before integration (Stage 9 inventory checks).
      - ./PLACEHOLDER_LIST.md:/flow-docs/PLACEHOLDER_LIST.md:ro
      - ./TEMPORARY_CODE_LIST.md:/flow-docs/TEMPORARY_CODE_LIST.md:ro
      - ./backend/Dockerfile:/flow-docs/Dockerfile:ro
      - ./compose.yaml:/flow-docs/compose.yaml:ro
      - flow_check_lock:/flow-lock
      - flow_check_maven:/root/.m2
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  flow_check_lock:
  flow_check_maven:
